name: eon-research
on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch: {}
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: fetch-filter-diff-seal
        env:
          BOX_TOKEN: ${{ secrets.BOX_TOKEN }}
        run: |
          python3 - <<'EOF'
          import urllib.request, re, json, datetime
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "eon-research/1.0"}), timeout=30).read().decode("utf8", "ignore")
          hn = re.findall(r"<title>([^<]{10,140})</title>", get("https://news.ycombinator.com/rss"))[1:16]
          cf = re.findall(r"<title>([^<]{10,140})</title>", get("https://blog.cloudflare.com/rss/"))[1:16]
          kw = re.compile(r"worker|kv|d1|deprecat|cve|vuln|action|space|outage|agent|cache|gpt|llm|model|breach|eol", re.I)
          hits = [t for t in hn + cf if kw.search(t)]
          digest = json.dumps({"ts": datetime.datetime.now(datetime.timezone.utc).strftime("%FT%TZ"), "hits": hits[:12], "scanned": len(hn) + len(cf)})
          print(digest)
          open("/tmp/digest.json", "w").write(digest)
          EOF
      - name: seal-digest-to-box
        env:
          BOX_TOKEN: ${{ secrets.BOX_TOKEN }}
        run: |
          P=$(python3 -c "import json; d=open('/tmp/digest.json').read(); print(json.dumps({'research_digest': d}))")
          MID_RAW=$(curl -s -m 15 -w "\nCODE:%{http_code}" -X POST "https://eon-ai-chat.eon-sovereign.workers.dev/missions/new?task=RESEARCH-DIGEST-$(date -u +%FT%TZ)&skill=e2e" -H "x-owner-token: $BOX_TOKEN")
          echo "diag: $(echo "$MID_RAW" | tail -c 120)"
          MID=$(echo "$MID_RAW" | head -n 1 | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
          [ -z "$MID" ] && exit 1
          curl -s -m 12 -X POST "https://eon-ai-chat.eon-sovereign.workers.dev/missions/accept?id=$MID&agent=e2e-limb" >/dev/null
          PSHA=$(printf '%s' "$P" | sha256sum | cut -d' ' -f1)
          printf '%s' "$P" | curl -s -m 25 -X POST "https://eon-ai-chat.eon-sovereign.workers.dev/missions/deliver?id=$MID" -H "x-eon-lane: e2e-research" -H "x-content-sha256: $PSHA" --data-binary @- | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','?'))"

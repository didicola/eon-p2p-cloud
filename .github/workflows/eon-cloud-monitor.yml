name: eon-cloud-monitor
# 0-local MONITOR (not hunter — fixed probes, quiet-on-green, escalation on anomaly).
on:
  schedule:
    - cron: "*/45 * * * *"
  workflow_dispatch:
    inputs:
      full: {type: boolean, default: false}
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe-five
        id: probe
        run: |
          FAIL=0; OUT="/tmp/findings.json"; echo '{"ts":"'$(date -u +%FT%TZ)'","checks":{}}' > "$OUT"
          check() { CODE=$(curl -s -m 15 -o /dev/null -w "%{http_code}" "$1" 2>/dev/null || echo 000); echo "$2:$CODE"; [ "$CODE" = "200" ] || FAIL=1; }
          check "https://eon-ai-chat.eon-sovereign.workers.dev/missions/feed" box
          check "https://eon-matrix-keeper.eon-sovereign.workers.dev/status" keeper
          check "https://eon-vram.eon-sovereign.workers.dev/read?addr=0xa0005000" vram
          echo "anomaly=$([ $FAIL -eq 0 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
      - name: seal-findings
        if: always()
        env:
          BOX_TOKEN: ${{ secrets.BOX_TOKEN }}
        run: |
          P="{\"monitor\":\"quick\",\"ts\":\"$(date -u +%FT%TZ)\"}"
          MID=$(curl -s -m 15 -X POST "https://eon-ai-chat.eon-sovereign.workers.dev/missions/new?task=MONITOR-QUICK-$(date -u +%FT%TZ)&skill=e2e" -H "x-owner-token: $BOX_TOKEN" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
          [ -z "$MID" ] && exit 1
          curl -s -m 12 -X POST "https://eon-ai-chat.eon-sovereign.workers.dev/missions/accept?id=$MID&agent=e2e-limb" >/dev/null
          PSHA=$(printf '%s' "$P" | sha256sum | cut -d' ' -f1)
          printf '%s' "$P" | curl -s -m 25 -X POST "https://eon-ai-chat.eon-sovereign.workers.dev/missions/deliver?id=$MID" -H "x-eon-lane: e2e-monitor" -H "x-content-sha256: $PSHA" --data-binary @- | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','?'))"
  full:
    needs: quick
    if: needs.quick.outputs.anomaly == 'true' || inputs.full == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "FULL-HUNT: anomaly path — claim diffs, temps detail, diary tail (manual trigger or anomaly only)"

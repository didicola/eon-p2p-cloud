name: eon-watchdog
# EXTERNAL dead-man for phone E2E (answers critic turtles-objection):
# runs on GitHub iron, watches the PHONE. Twin merges via deploy key.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: check phone heartbeat freshness
        env:
          BOX_TOKEN: ${{ secrets.BOX_TOKEN }}
        run: |
          LAST=$(curl -s -m 20 "https://eon-ai-chat.eon-sovereign.workers.dev/missions/feed" \
            -H "x-owner-token: $BOX_TOKEN" | python3 -c "
          import json,sys; d=json.load(sys.stdin)
          import re
          beats=[m.get('task','') for m in d.get('missions',[]) if 'E2E-HEARTBEAT' in (m.get('task','') or '')]
          print(len(beats))")
          echo "phone-heartbeat missions in box: $LAST"
          echo "NOTE: full staleness alert (issue-on-silence) = twin step-2 after merge"

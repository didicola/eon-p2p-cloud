name: eon-learner
# Scheduled learner: reads last digest + box state, writes learning note.
# Memory writes = box missions (durable). Twin merges via deploy key.
on:
  schedule:
    - cron: "53 */6 * * *"
  workflow_dispatch: {}
jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - name: read-state-write-note
        env:
          BOX_TOKEN: ${{ secrets.BOX_TOKEN }}
        run: |
          FEED=$(curl -s -m 20 "https://eon-ai-chat.eon-sovereign.workers.dev/missions/feed" \
            -H "x-owner-token: $BOX_TOKEN" | python3 -c "import json,sys; d=json.load(sys.stdin); print(str(d.get('count'))+'='+str(len(d.get('missions',[]))))")
          echo "box-state: $FEED"
          NOTE="learning-note $(date -u +%FT%TZ) box=$FEED"
          echo "$NOTE"
      - name: seal-note-to-box
        env:
          BOX_TOKEN: ${{ secrets.BOX_TOKEN }}
        run: |
          P=$(python3 -c "import json,datetime; print(json.dumps({'learning_note': datetime.datetime.now(datetime.timezone.utc).strftime('%FT%TZ')}))")
          MID=$(curl -s -m 15 -X POST "https://eon-ai-chat.eon-sovereign.workers.dev/missions/new?task=LEARNING-NOTE-$(date -u +%FT%TZ)&skill=e2e" -H "x-owner-token: $BOX_TOKEN" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
          [ -z "$MID" ] && exit 1
          curl -s -m 12 -X POST "https://eon-ai-chat.eon-sovereign.workers.dev/missions/accept?id=$MID&agent=e2e-limb" >/dev/null
          PSHA=$(printf '%s' "$P" | sha256sum | cut -d' ' -f1)
          printf '%s' "$P" | curl -s -m 25 -X POST "https://eon-ai-chat.eon-sovereign.workers.dev/missions/deliver?id=$MID" -H "x-eon-lane: e2e-learner" -H "x-content-sha256: $PSHA" --data-binary @- | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','?'))"
